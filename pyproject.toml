[project]
name = "abaqus-mcp"
version = "0.1.0"
description = "MCP server that drives Abaqus in a Windows VM over ssh"
authors = [{ name = "Enej Podlipnik" }]
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
abaqus-mcp = "abaqus_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["vm: needs the live VM (ABAQUS_VM=1), no Abaqus install"]
